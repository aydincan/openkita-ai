[project]
name = "openkita-backend"
version = "0.1.0"
description = "OpenKita AI backend (FastAPI)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "httpx>=0.27,<1",
    "argon2-cffi>=23.1,<26",
    "jsonschema>=4.23,<5",
    "python-docx>=1.1,<2",
    "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.0,<2",
    "httpx2>=2.16,<3",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "docx", "docx.*", "reportlab", "reportlab.*", "argon2", "argon2.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
]
