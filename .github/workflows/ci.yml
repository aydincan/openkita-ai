name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (version in the comment).
# Dependabot (.github/dependabot.yml) proposes updates.

jobs:
  backend:
    name: Backend (ruff, mypy, pytest, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: openkita
          POSTGRES_PASSWORD: "p@ss/w0rd:#?"
          POSTGRES_DB: openkita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openkita -d openkita"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # Real-database test + migrations use the same special-character password as production would.
      RUN_DB_TESTS: "1"
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: openkita
      POSTGRES_PASSWORD: "p@ss/w0rd:#?"
      POSTGRES_DB: openkita
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Lock files are up to date
        run: |
          uv lock --check
          uv export --frozen --no-emit-project --format requirements-txt -o /tmp/requirements.lock.txt
          # The generated header records the -o path, so compare the pinned requirements only.
          diff -u <(tail -n +3 requirements.lock.txt) <(tail -n +3 /tmp/requirements.lock.txt)
      - name: Install (from uv.lock)
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (including real PostgreSQL)
        run: uv run pytest -q
      - name: Migrations upgrade / downgrade / upgrade
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (compose config + image build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI-only throw-away value; real deployments set their own in .env.
      POSTGRES_PASSWORD: ci-only-Throwaway-pw-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose --profile ollama config -q
          docker compose -f docker-compose.yml -f deployment/docker/compose.dev.yml config -q
      - name: Compose refuses to start without a password
        run: |
          if POSTGRES_PASSWORD= docker compose config -q 2>/dev/null; then
            echo "compose accepted an empty POSTGRES_PASSWORD" >&2; exit 1
          fi
      - name: Build images
        run: docker compose build
